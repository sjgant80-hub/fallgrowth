name: proof-of-play
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: the growth-learning law against its falsifiable examples
        run: node --test grow.test.mjs
      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the growth law, then READ the verdict (must be CLEAN)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate grow.mjs \
            --timeout 60000 --cap 800 --baseline witness.baseline.json \
            --test node --test grow.test.mjs | tee verdict.txt
          grep -q '"clean": true' verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
      - name: the live page still carries the gated law (no drift)
        run: |
          cp index.html /tmp/shipped.html
          node build-page.mjs
          diff -q /tmp/shipped.html index.html || { echo "::error::index.html drifted from grow.mjs — run node build-page.mjs and commit"; exit 1; }
